user  nginx;
worker_processes  auto;
worker_rlimit_nofile 100000;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  20480;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-Performance Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    # Kernel Socket & TCP Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # GZip Dynamic Compression (Reduces network traffic by 75-80%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # Micro-Cache Configuration (Serves 1M readers at sub-millisecond speeds)
    proxy_cache_path /var/cache/nginx/worldgames
                     levels=1:2
                     keys_zone=worldgames_cache:50m
                     max_size=2g
                     inactive=60m
                     use_temp_path=off;

    # Rate Limiting (Protects from runaway scrapers while allowing burst reads)
    limit_req_zone $binary_remote_addr zone=reader_limit:20m rate=100r/s;

    upstream backend_cluster {
        least_conn;
        server backend:8001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Static React SPA Assets (Max Aggressive Caching)
        location /assets/ {
            proxy_pass http://backend_cluster;
            proxy_cache worldgames_cache;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Public Reader Feed & Sports Articles API (Micro-cached at edge)
        location ~ ^/api/v1/(publish/(feed|stats)|articles) {
            limit_req zone=reader_limit burst=200 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Edge Micro-Caching: 120s cache absorbs 1M simultaneous reads
            proxy_cache worldgames_cache;
            proxy_cache_valid 200 120s;
            proxy_cache_valid 304 120s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=120, s-maxage=600, stale-while-revalidate=86400";
        }

        # General Proxy for Admin, Workflow & SPA
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
